name: Publicar no GitHub Pages

# Publica o site em https://aureliosaraiva.github.io/mapa-maconaria/ (noindex enquanto o
# autor não decidir indexação). Só publica se validadores, testes, build e QA passarem.
# Ativação: Settings → Pages → Source = "GitHub Actions" (o passo configure-pages tenta
# ativar sozinho; se o token não tiver permissão, o autor ativa uma vez à mão).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_BASE: /mapa-maconaria
  SITE_URL: https://aureliosaraiva.github.io
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nada do acervo privado neste repositório público
        run: |
          n=$(git ls-files 'acervo/pdf/*' 'acervo/txt/*' 'acervo/html/*' '*.pdf' | wc -l)
          if [ "$n" -gt 0 ]; then
            echo "::error title=Acervo no repositório público::Texto integral das fontes fica só no repositório privado fontes-maconaria (CLAUDE.md)."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml
      - name: Fontes
        run: python3 scripts/validar_fontes.py | tail -n 5
      - name: Verbetes e conexões
        run: python3 scripts/validar_verbetes.py
      - name: Linha do tempo (fragmentos)
        run: python3 scripts/validar_linha_do_tempo.py
      - name: Anti-cópia
        run: python3 scripts/anticopia.py
      - name: Testes dos validadores
        run: python3 -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Build (Astro + Pagefind) com base /mapa-maconaria
        working-directory: site
        run: npm run build
      - name: QA do site (links, cobertura, nada do acervo, alerta ritual, noindex)
        run: python3 scripts/qa_site.py
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
